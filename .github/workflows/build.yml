name: Build NDS-Shop (DSi)

on:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'README_FR.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build DSi with Wonderful Toolchain
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Wonderful Toolchain
        run: |
          curl -sL https://wonderful.asie.pl/bootstrap/wf-installer.sh | bash -s -- --no-interactive
          source ~/.wonderful/env
          export PATH=$PATH:~/.wonderful/bin
      - name: Build DSi
        run: |
          source ~/.wonderful/env
          python build.py release
          mkdir -p ~/artifacts
          cp release/NDS-Shop.nds ~/artifacts
          cp release/version.txt ~/artifacts
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: ~/artifacts/*
          name: build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    name: Publish GitHub Release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*
          body_path: .github/RELEASE_NOTES.md
          fail_on_unmatched_files: true