name: Build NDS-Shop (DSi)

on:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'README_FR.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build DSi with Wonderful Toolchain
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix submodule
        run: |
          git submodule update --init --recursive

      - name: Install Wonderful Toolchain
        run: |
          sudo mkdir -p /opt/wonderful
          sudo chown -R $USER:$USER /opt/wonderful
          curl -fL https://wonderful.asie.pl/bootstrap/wf-bootstrap-x86_64.tar.gz | tar -xz -C /opt/wonderful
          /opt/wonderful/bin/wf-pacman -Syu --noconfirm wf-tools
          echo "WONDERFUL_TOOLCHAIN=/opt/wonderful" >> $GITHUB_ENV
          echo "/opt/wonderful/bin" >> $GITHUB_PATH

      - name: Install Toolchain Packages
        run: |
          wf-pacman -Syu --noconfirm
          wf-pacman -S --noconfirm toolchain-gcc-arm-none-eabi target-arm-none-eabi-blocksds target-arm-none-eabi-libnds || \
          wf-pacman -S --noconfirm $(wf-pacman -Slq | grep -E '^(toolchain|target)-(.*nds|.*dsi|.*arm-none-eabi)')

      - name: Build DSi
        run: |
          source /opt/wonderful/bin/wf-env -a
          python build.py release
          mkdir -p ~/artifacts
          cp release/NDS-Shop.nds ~/artifacts/
          cp release/version.txt ~/artifacts/

      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: ~/artifacts/*
          name: build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    name: Publish GitHub Release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*
          body_path: .github/RELEASE_NOTES.md
          fail_on_unmatched_files: true